  <div class="container">
    <h2>Silahkan Isi Buku Tamu</h2>
    <form id="bukuTamuForm">
      <label for="nama">Nama:</label>
      <input type="text" id="nama" name="nama" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="instansi">Asal Sekolah:</label>
      <input type="text" id="instansi" name="instansi" />

      <label for="pesan">Pesan dan Kesan:</label>
      <textarea id="pesan" name="pesan" rows="4" required></textarea>

      <button type="submit">Kirim</button>
    </form>
    <div id="output"></div>
  </div>

  <script>
    document.getElementById("bukuTamuForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const nama = document.getElementById("nama").value;
      const email = document.getElementById("email").value;
      const instansi = document.getElementById("instansi").value;
      const pesan = document.getElementById("pesan").value;

      const output = `
        <h4>Terima kasih atas kunjungan Anda!</h4>
        <p><strong>Nama:</strong> ${nama}</p>
        <p><strong>Email:</strong> ${email}</p>
        <p><strong>Instansi:</strong> ${instansi}</p>
        <p><strong>Pesan:</strong> ${pesan}</p>
      `;

      document.getElementById("output").innerHTML = output;

      document.getElementById("bukuTamuForm").reset();
    });
  </script>
